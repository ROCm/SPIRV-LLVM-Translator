# Merge-watcher for the rocm-examples pin bump PRs produced by
# update-rocm-examples.yml (PR title "Bump rocm-examples pin").
#
# Unlike automerge-after-ci.yml, this does NOT require the whole "SPIRV
# Compiler CI" workflow to succeed. The rocm-examples pin only depends on two
# jobs -- Build and Test rocm-examples -- so an unrelated red job (test_codegen,
# test_comgr, test_translator_lit) must not block the bump. We therefore fire on
# any workflow_run conclusion and self-gate on the two specific check-runs.
#
# Because the jobs run inside the called reusable workflow spirv-ci-linux.yml
# (via the "Linux::release" caller job), their check-run names surface as:
#   "Linux::release / Build"
#   "Linux::release / Test rocm-examples"
# We require those exact job names from the triggering run attempt.
#
# Requires (same App as upstream-merge.yml):
#   - Secret MERGE_APP_ID
#   - Secret MERGE_APP_PRIVATE_KEY
#   - The MERGE_APP App must be a bypass actor on the
#     block-merge-commit-on-amd-*-branches ruleset.

name: Auto-merge rocm-examples pin PRs

on:
  # API-only: validate the bot PR and tested SHA; never check out PR code or artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["SPIRV Compiler CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: automerge-rocm-examples-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gated-merge:
    name: Merge rocm-examples bump if Build + Test rocm-examples passed
    runs-on: ubuntu-latest
    # Note: no conclusion == 'success' filter -- we self-gate on check-runs.
    if: >-
      github.repository == 'ROCm/SPIRV-LLVM-Translator' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'deps/rocm-examples' &&
      startsWith(github.event.workflow_run.display_title, 'Bump rocm-examples pin')
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read # Inspect jobs from the triggering run.

      - name: Gate on Build + Test rocm-examples, then merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          PRS=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --base amd-staging \
            --state open --json number)
          if [ "$(jq 'length' <<< "$PRS")" != 1 ]; then
            echo "Expected one open PR for the tested branch; skipping."
            exit 0
          fi
          PR=$(jq -r '.[0].number' <<< "$PRS")
          DETAILS=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e --arg repo "$REPO" --arg sha "$HEAD_SHA" \
            --arg branch "$HEAD_BRANCH" --arg author "$EXPECTED_AUTHOR" '
              .state == "open" and .draft == false and
              .base.ref == "amd-staging" and .base.repo.full_name == $repo and
              .head.repo.full_name == $repo and .head.ref == $branch and
              .head.sha == $sha and .user.login == $author
            ' <<< "$DETAILS" >/dev/null; then
            echo "PR no longer matches the bot branch and tested commit; skipping."
            exit 0
          fi

          # Only accept jobs from this exact CI run attempt, not similarly named checks.
          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --paginate --jq '.jobs[]' | jq -s '.')
          if ! jq -e '
            . as $jobs |
            all(["Linux::release / Build", "Linux::release / Test rocm-examples"][]; . as $name |
              [$jobs[] | select(.name == $name)] |
              length == 1 and all(.[]; .status == "completed" and .conclusion == "success"))
            ' <<< "$JOBS" >/dev/null; then
            echo "Build and Test rocm-examples did not both pass in this run; skipping."
            exit 0
          fi

          # Pin the merge to the tested commit even if the rolling branch moves now.
          gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"
