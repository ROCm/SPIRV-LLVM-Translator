name: Build Multi-Arch Tarballs

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID to fetch artifacts from (defaults to current run)"
        type: string
        default: ""
      artifact_github_repo:
        description: "GitHub repository for artifact_run_id"
        type: string
        default: ROCm/TheRock
      dist_amdgpu_families:
        description: "Semicolon-separated list of GPU families (e.g. 'gfx94X-dcgpu;gfx110X-all')"
        type: string
      platform:
        type: choice
        description: "Platform to fetch artifacts for"
        options:
          - linux
          - windows
        default: "linux"
      package_version:
        description: "ROCm package version string (e.g. '7.13.0.dev0+abc123')"
        type: string
      release_type:
        description: 'Release type: "" for CI, or "dev", "nightly", "prerelease".'
        type: string
        default: ""
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      artifact_github_repo:
        type: string
        default: ""
      dist_amdgpu_families:
        type: string
        required: true
      platform:
        type: string
        default: "linux"
      package_version:
        type: string
        required: true
      release_type:
        type: string
        default: ""
permissions:
  contents: read

run-name: Build Multi-Arch Tarballs (${{ inputs.dist_amdgpu_families }}, ${{ inputs.platform }})

jobs:
  build_tarballs:
    name: Build Tarballs
    runs-on: ${{ github.repository_owner == 'ROCm' && 'azure-linux-scale-rocm' || 'ubuntu-24.04' }}
    permissions:
      id-token: write
    env:
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      RELEASE_TYPE: ${{ inputs.release_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Build tarballs
        env:
          INPUTS_ARTIFACT_GITHUB_REPO: ${{ inputs.artifact_github_repo }}
          INPUTS_DIST_AMDGPU_FAMILIES: ${{ inputs.dist_amdgpu_families }}
          INPUTS_PLATFORM: ${{ inputs.platform }}
          INPUTS_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python build_tools/build_tarballs.py \
            --run-id="${ARTIFACT_RUN_ID}" \
            --run-github-repo="${INPUTS_ARTIFACT_GITHUB_REPO}" \
            --dist-amdgpu-families="${INPUTS_DIST_AMDGPU_FAMILIES}" \
            --platform="${INPUTS_PLATFORM}" \
            --package-version="${INPUTS_PACKAGE_VERSION}" \
            --output-dir="${GITHUB_WORKSPACE}/tarballs"
      - name: Configure AWS Credentials
        uses: ROCm/TheRock/.github/actions/configure_aws_artifacts_credentials@590409d89b1adb01695e0f2a075ebdc89e73baec # compiler/amd-staging
        with:
          release_type: ${{ inputs.release_type }}

      - name: Upload tarballs
        id: upload
        env:
          INPUTS_PLATFORM: ${{ inputs.platform }}
          INPUTS_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python build_tools/github_actions/upload_tarballs.py \
            --input-tarballs-dir="${GITHUB_WORKSPACE}/tarballs" \
            --run-id="${GITHUB_RUN_ID}" \
            --platform="${INPUTS_PLATFORM}" \
            --release-type="${INPUTS_RELEASE_TYPE}"
