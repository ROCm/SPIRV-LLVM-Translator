# Linux variant of the SPIRV CI: builds LLVM/Clang/translator/Comgr in
# one job and runs SPIRV-relevant test suites in parallel test jobs that
# consume a GHA artifact uploaded by the build job.

name: SPIRV Compiler CI - Linux

on:
  workflow_call:

env:
  SRC_DIR: src
  BUILD_DIR: build
  INSTALL_DIR: install
  STAGING_SRC: src/therock_staging
  STAGING_BUILD: build/therock_staging
  STAGING_INSTALL: install/therock_staging
  STAGING_ARTIFACT_NAME: therock-staging-linux
  STAGING_ARTIFACT_ARCHIVE: therock-staging-linux.tar

jobs:
  # =====================================================================
  # Build LLVM + Clang + amd-llvm-spirv + device-libs + Comgr.
  # Strip binaries and upload the build trees as a single artifact for
  # the test jobs to consume.
  # =====================================================================
  build:
    name: Build
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    outputs:
      llvm_project_sha: ${{ steps.resolve_llvm_sha.outputs.sha }}
    if: false

    steps:
      # ---- Checkout ---------------------------------------------------------
      # llvm-project at amd-staging tip provides the host LLVM/Clang/LLD plus
      # the amd/ subprojects (device-libs, comgr). The SPIRV translator PR
      # head is overlaid in-tree under llvm/projects/.
      - name: Checkout llvm-project (amd-staging)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/llvm-project
          ref: amd-staging
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      # Capture the resolved amd-staging SHA so test jobs can pin to the
      # exact commit this build used. Without this, test jobs re-resolve
      # `amd-staging` and may land on a newer commit if upstream merged
      # mid-run, triggering a cascade rebuild against an older build.ninja.
      - name: Resolve llvm-project SHA
        id: resolve_llvm_sha
        run: |
          SHA=$(git -C llvm-project rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned llvm-project SHA for test jobs: $SHA"

      - name: Checkout SPIRV-LLVM-Translator (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          fetch-depth: 1
          persist-credentials: false

      # ---- Build LLVM + Clang + LLD + in-tree SPIRV translator --------------
      - name: Configure LLVM
        run: |
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AMDGPU;X86;SPIRV" \
            -DLLVM_INCLUDE_TESTS=ON \
            -DLLVM_INSTALL_GTEST=ON \
            -DLLVM_LIT_ARGS="-sv --no-progress-bar" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
            -DCOMPILER_RT_BUILD_BUILTINS=ON \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_BUILD_MEMPROF=OFF \
            -DCOMPILER_RT_BUILD_PROFILE=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF \
            -DCOMPILER_RT_BUILD_ORC=OFF \
            -DCOMPILER_RT_BUILD_GWP_ASAN=OFF

      - name: Build LLVM + Clang + amd-llvm-spirv + test deps
        # *-test-depends pull in all tools needed for lit (FileCheck, not,
        # llc, llvm-*, clang, opt, etc.) and stay current with upstream.
        # `builtins` builds compiler-rt's libclang_rt.builtins.a, which
        # hip-lang-config.cmake hard-requires when downstream projects
        # `enable_language(HIP)` (linked into hip-lang::device).
        run: ninja -C build llvm-test-depends clang-test-depends amd-llvm-spirv builtins

      # ---- Build device-libs (standalone, against built LLVM) --------------
      - name: Configure device-libs
        run: |
          cmake -G Ninja -S llvm-project/amd/device-libs -B build-device-libs \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$PWD/build \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_DIR=$PWD/build/lib/cmake/llvm

      - name: Build device-libs
        run: ninja -C build-device-libs

      # ---- Build Comgr (standalone, against built LLVM + device-libs) ------
      - name: Configure Comgr
        # LLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR points Comgr at
        # the in-tree translator headers so COMGR_SPIRV_TRANSLATOR_AVAILABLE
        # turns ON (otherwise translator-dependent lit tests are UNSUPPORTED).
        # CMAKE_INSTALL_LIBDIR=lib so the install lands in staging/lib (not
        # lib64) and the runtime resolver finds libamd_comgr.so.3 there
        # instead of falling through to /opt/rocm on the test runner.
        run: |
          cmake -G Ninja -S llvm-project/amd/comgr -B build-comgr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PWD/build;$PWD/build-device-libs" \
            -DLLVM_DIR=$PWD/build/lib/cmake/llvm \
            -DLLVM_EXTERNAL_SPIRV_LLVM_TRANSLATOR_SOURCE_DIR=$PWD/llvm-project/llvm/projects/SPIRV-LLVM-Translator \
            -DBUILD_TESTING=ON

      - name: Build Comgr
        run: ninja -C build-comgr amd_comgr

      # ---- In-pipeline HIP runtime build ----------------------------------
      # Builds ROCR-Runtime (libhsa-runtime64.so) and CLR (libamdhip64.so)
      # against the just-built clang, plus installs comgr + device-libs into
      # the same staging tree. Result: a self-contained ROCm install layout
      # under `staging/` that PR clang can target via `--rocm-path` to
      # compile and run HIP for `--offload-arch=amdgcnspirv`.
      #
      # Why in-pipeline (vs pulling a prebuilt nightly tarball): TheRock's
      # public `therock-nightly-tarball` bucket only publishes consumer
      # (dgpu) families on a daily cadence; gfx94X / gfx950 (dcgpu) tarballs
      # stopped Oct 2025, and TheRock's own multi-arch CI for those families
      # builds the runtime in-pipeline for the same reason.
      - name: Install build deps for runtime build
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            numactl-devel elfutils-libelf-devel libdrm-devel || true

      - name: Install comgr + device-libs into staging
        # CMake `--install` lays them out under <prefix>/include/amd_comgr,
        # <prefix>/lib/cmake/amd_comgr, <prefix>/amdgcn/bitcode/ — the
        # installed-tree layout that clang's `--rocm-path` and CLR's
        # find_package(amd_comgr) both expect. Build-dir layouts won't do.
        run: |
          cmake --install build-comgr --prefix $PWD/staging
          cmake --install build-device-libs --prefix $PWD/staging
          echo "=== staging/lib after install (comgr files) ==="
          ls -la staging/lib/libamd_comgr* 2>&1 || true

      - name: Checkout rocm-systems (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-systems
          ref: 8bb3b73c117e5630106540447268ccad771906a4 # develop, 2026-05-15
          path: rocm-systems
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout rocm-cmake (pinned)
        # Provides ROCM cmake modules (ROCMConfig) that CLR's build needs.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-cmake
          ref: 4d391d7bda62a0f476dbadb383e99f4508c7415d # develop, 2026-05-12
          path: rocm-cmake
          fetch-depth: 1
          persist-credentials: false

      - name: Configure ROCR-Runtime
        # LLVM_DIR/Clang_DIR are explicit because rocr-runtime's
        # trap_handler/CMakeLists.txt does find_package(Clang) and will
        # otherwise grab a stale system-installed clang config.
        # CMAKE_INSTALL_LIBDIR=lib because the manylinux container defaults
        # to lib64 and clang's --rocm-path looks at <prefix>/lib.
        run: |
          cmake -G Ninja -S rocm-systems/projects/rocr-runtime -B build-rocr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/build/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DLLVM_DIR=$PWD/build/lib/cmake/llvm \
            -DClang_DIR=$PWD/build/lib/cmake/clang

      - name: Build ROCR-Runtime
        # ROCM_PATH points clang at our staging tree when ROCR's image lib
        # compiles OpenCL blit bitcode (no /opt/rocm in the CI container).
        env:
          ROCM_PATH: ${{ github.workspace }}/staging
        run: ninja -C build-rocr install

      - name: Configure CLR (HIP runtime)
        # ROCM_KPACK_ENABLED, HIP_ENABLE_ROCPROFILER_REGISTER, HIPCC_BIN_DIR=
        # are explicit-disable knobs for optional deps we don't need; without
        # them the configure errors out with REQUIRED-not-found.
        run: |
          cmake -G Ninja -S rocm-systems/projects/clr -B build-clr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$PWD/build/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$PWD/staging;$PWD/build;$PWD/rocm-cmake/share/rocm" \
            -DHIP_PLATFORM=amd \
            -DHIP_COMMON_DIR=$PWD/rocm-systems/projects/hip \
            -DCLR_BUILD_HIP=ON \
            -DROCM_KPACK_ENABLED=OFF \
            -DHIP_ENABLE_ROCPROFILER_REGISTER=OFF \
            -DHIPCC_BIN_DIR=

      - name: Build CLR
        run: ninja -C build-clr install

      - name: Stage translator binary for runtime SPIRV JIT
        # HIP runtime calls Comgr at kernel-launch to translate the embedded
        # SPIR-V to AMDGPU code. Comgr looks for the translator at
        # <libamd_comgr.so dir>/../bin/amd-llvm-spirv.
        run: |
          mkdir -p staging/bin
          cp -a build/bin/amd-llvm-spirv staging/bin/

      # ---- Create hipconfig script for rocPRIM/hipCUB detection -----------
      - name: Create hipconfig script
        run: |
          mkdir -p staging/bin
          cat > staging/bin/hipconfig << 'EOF'
          #!/bin/bash
          case "$1" in
            --platform) echo "amd" ;;
            --compiler) echo "clang" ;;
            --runtime) echo "rocclr" ;;
            --hipclangpath) echo "$PWD/build/bin" ;;
            *) echo "amd" ;;
          esac
          EOF
          chmod +x staging/bin/hipconfig

      # ---- Build rocPRIM (header-only but needs install) -------------------
      - name: Checkout rocPRIM
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocPRIM
          ref: develop
          path: rocPRIM
          fetch-depth: 1
          persist-credentials: false

      - name: Configure and install rocPRIM
        run: |
          export PATH=$PWD/staging/bin:$PATH
          cmake -G Ninja -S rocPRIM -B build-rocprim \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/staging;$PWD/build" \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DGPU_TARGETS="gfx942" \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C build-rocprim
          cmake --install build-rocprim --prefix $PWD/staging

      # ---- Build hipCUB (depends on rocPRIM) -------------------------------
      - name: Checkout hipCUB
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/hipCUB
          ref: develop
          path: hipCUB
          fetch-depth: 1
          persist-credentials: false

      - name: Configure and install hipCUB
        run: |
          cmake -G Ninja -S hipCUB -B build-hipcub \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/staging;$PWD/build" \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DGPU_TARGETS="gfx942" \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF
          ninja -C build-hipcub
          cmake --install build-hipcub --prefix $PWD/staging

      # ---- Build rocRAND ---------------------------------------------------
      - name: Checkout rocRAND
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocRAND
          ref: develop
          path: rocRAND
          fetch-depth: 1
          persist-credentials: false

      - name: Configure and build rocRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/staging
        run: |
          cmake -G Ninja -S rocRAND -B build-rocrand \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/staging;$PWD/build" \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DAMDGPU_TARGETS="gfx942" \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DCMAKE_HIP_FLAGS="--rocm-path=$PWD/staging"
          ninja -C build-rocrand
          cmake --install build-rocrand --prefix $PWD/staging

      # ---- Build hipRAND (wrapper over rocRAND) ---------------------------
      - name: Checkout hipRAND
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/hipRAND
          ref: develop
          path: hipRAND
          fetch-depth: 1
          persist-credentials: false

      - name: Configure and build hipRAND
        env:
          ROCM_PATH: ${{ github.workspace }}/staging
        run: |
          cmake -G Ninja -S hipRAND -B build-hiprand \
            -DCMAKE_CXX_COMPILER=$PWD/build/bin/clang++ \
            -DCMAKE_PREFIX_PATH="$PWD/staging;$PWD/build" \
            -DCMAKE_INSTALL_PREFIX=$PWD/staging \
            -DBUILD_TEST=OFF \
            -DBUILD_BENCHMARK=OFF \
            -DROCRAND_PATH=$PWD/staging
          ninja -C build-hiprand
          cmake --install build-hiprand --prefix $PWD/staging

      # ---- Strip + upload artifact -----------------------------------------
      # Strip binaries to keep the artifact under GHA's 10GB cap and shorten
      # upload/download time. Tests don't need debug symbols. `--strip-unneeded`
      # preserves dynamic symbols needed at link/load time.
      - name: Strip binaries
        run: |
          find build build-comgr build-device-libs build-rocr build-clr \
            build-rocprim build-hipcub build-rocrand build-hiprand staging \
            -type f \( -executable -o -name '*.so*' -o -name '*.a' \) \
            -exec strip --strip-unneeded {} + 2>/dev/null || true

      # Tar before upload: actions/upload-artifact@v4 strips +x bits and
      # excludes hidden files (loses FetchContent .git dirs).
      - name: Tar build trees
        run: |
          tar -cf linux-build-tree.tar \
            build build-comgr build-device-libs build-rocr build-clr \
            build-rocprim build-hipcub build-rocrand build-hiprand staging


      - name: Upload build tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-tree
          path: linux-build-tree.tar
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  # =====================================================================
  # Test - SPIRV translator lit (with PR-head vs amd-staging baseline diff)
  # =====================================================================
  # Non-blocking: upstream Khronos breaks ~1 translator lit test per week
  # (spirv-val drift, LLVM IR changes vs DebugInfo tests, DCE). Their fixes
  # typically land within a day; our daily upstream-merge cron pulls them
  # in. Blocking here would gate unrelated PRs during those windows. The
  # baseline run partitions failures into new / fixed / pre-existing so
  # AMD-side regressions stay visible.
  test_translator_lit:
    name: Test SPIRV translator lit
    needs: build
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421

    steps:
      - name: Checkout llvm-project (pinned to Build job SHA)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/llvm-project
          ref: ${{ needs.build.outputs.llvm_project_sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-tree

      # touch build.ninja so it's newer than CMakeCache.txt — without it
      # tar -m's per-file mtimes can trigger a cmake regen + cascade rebuild.
      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja

      - name: Test - SPIRV Translator (check-amd-llvm-spirv) [PR head]
        id: check_spirv_xlator
        continue-on-error: true
        run: |
          set -o pipefail
          ninja -C build check-amd-llvm-spirv 2>&1 | tee build/check-amd-llvm-spirv.log

      - name: Capture PR head translator failures
        if: always()
        run: |
          grep -oE '^FAIL: LLVM_SPIRV :: \S+' build/check-amd-llvm-spirv.log \
            | sort -u > build/spirv-fails-pr.txt || true
          echo "PR head failures:"; cat build/spirv-fails-pr.txt

      - name: Switch translator to amd-staging tip for baseline
        if: always()
        run: |
          cd llvm-project/llvm/projects/SPIRV-LLVM-Translator
          git fetch --depth=1 origin amd-staging
          git checkout FETCH_HEAD

      - name: Test - SPIRV Translator [baseline amd-staging]
        # Re-run the lit suite with the translator at amd-staging tip so the
        # gating step can flag only PR-introduced failures (filtering out
        # pre-existing baseline failures). Incremental rebuild — only
        # translator objects change.
        if: always()
        id: check_spirv_baseline
        continue-on-error: true
        run: |
          set -o pipefail
          # Re-configure to pick up any CMakeLists / file-list changes in the swap
          cmake -G Ninja -S llvm-project/llvm -B build
          ninja -C build check-amd-llvm-spirv 2>&1 \
            | tee build/check-amd-llvm-spirv-baseline.log

      - name: Capture baseline translator failures
        # Split from the lit step so a non-zero ninja exit (lit failures +
        # set -o pipefail under bash -e) doesn't skip this grep.
        if: always()
        run: |
          grep -oE '^FAIL: LLVM_SPIRV :: \S+' build/check-amd-llvm-spirv-baseline.log \
            | sort -u > build/spirv-fails-baseline.txt || true
          echo "Baseline failures:"; cat build/spirv-fails-baseline.txt

      # Fail the job on real regressions (PR head FAILs that aren't on
      # amd-staging baseline). Pre-existing baseline failures don't block.
      - name: Gate - new translator lit failures
        if: always()
        run: |
          if [ ! -f build/spirv-fails-pr.txt ] || [ ! -f build/spirv-fails-baseline.txt ]; then
            echo "::warning::Could not compute new-failure delta (missing pr.txt or baseline.txt); not gating."
            exit 0
          fi
          new=$(comm -23 build/spirv-fails-pr.txt build/spirv-fails-baseline.txt)
          if [ -n "$new" ]; then
            count=$(printf '%s\n' "$new" | wc -l)
            echo "::error::$count new translator lit failure(s) introduced by this PR:"
            printf '%s\n' "$new" | sed 's/^/::error::  /'
            exit 1
          fi
          echo "No new translator lit failures vs amd-staging baseline."

  # =====================================================================
  # Test - LLVM SPIRV codegen lit suite
  # =====================================================================
  test_codegen:
    name: Test LLVM SPIRV codegen
    needs: build
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 15
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421

    steps:
      - name: Checkout llvm-project (pinned to Build job SHA)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/llvm-project
          ref: ${{ needs.build.outputs.llvm_project_sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-tree

      # touch build.ninja so it's newer than CMakeCache.txt — without it
      # tar -m's per-file mtimes can trigger a cmake regen + cascade rebuild.
      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja

      - name: Test - LLVM SPIRV backend (check-llvm-codegen-spirv)
        run: ninja -C build check-llvm-codegen-spirv

  # =====================================================================
  # Test - Comgr (lit + gtest + ctest)
  # =====================================================================
  test_comgr:
    name: Test Comgr
    needs: build
    runs-on: azure-linux-scale-rocm
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421

    steps:
      - name: Checkout llvm-project (pinned to Build job SHA)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/llvm-project
          ref: ${{ needs.build.outputs.llvm_project_sha }}
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-LLVM-Translator (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: llvm-project/llvm/projects/SPIRV-LLVM-Translator
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-tree

      # touch build.ninja so it's newer than CMakeCache.txt — without it
      # tar -m's per-file mtimes can trigger a cmake regen + cascade rebuild.
      - name: Untar build trees
        run: |
          tar -xmf linux-build-tree.tar
          touch build/build.ninja build-comgr/build.ninja build-device-libs/build.ninja

      - name: Test - Comgr (check-comgr)
        # check-comgr depends on test-lit (runs lit suite) and test-unit
        # (runs gtest binaries via its COMMAND block), then runs ctest for
        # the legacy C tests. Single target = all three test layers.
        id: check_comgr
        run: ninja -C build-comgr check-comgr

      - name: Show failed Comgr ctest output
        # check-comgr invokes ctest without --output-on-failure, so failures
        # show "***Failed" with no stderr. Re-run any failed cases verbosely
        # and redirect comgr's internal log buffer to stderr so clang errors
        # from inside amd_comgr_do_action() surface (otherwise comgr just
        # returns AMD_COMGR_STATUS_ERROR with no detail).
        if: failure() && steps.check_comgr.conclusion == 'failure'
        env:
          AMD_COMGR_REDIRECT_LOGS: stderr
        run: ctest --test-dir build-comgr --output-on-failure --rerun-failed

  # =====================================================================
  # Test - rocm-examples (compile + run hello-world via amdgcnspirv)
  # =====================================================================
  # Drives PR clang through the SPIRV translator on a real HIP example
  # and JIT-runs the SPIR-V on a gfx942 GPU. Catches translator/codegen
  # bugs that pass lit but fail at runtime kernel-load. Informational
  # initially; promote to required once stable.
  test_rocm_examples:
    name: Test rocm-examples
    needs: build
    runs-on: linux-gfx942-1gpu-ossci-rocm
    if: false
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
      options: |
        --device=/dev/kfd --device=/dev/dri  --group-add video

    steps:
      - name: Checkout rocm-examples (pinned)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ROCm/rocm-examples
          ref: e260595e2ec06f8a8714bd67bb1bc93d6c27e589 # amd-staging, 2026-05-28
          path: rocm-examples
          fetch-depth: 1
          persist-credentials: false

      - name: Download build tree artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-tree

      - name: Untar build trees
        run: tar -xmf linux-build-tree.tar

      - name: Install libnuma
        run: dnf install -y numactl-libs

      - name: Compile hello-world via amdgcnspirv
        # Flags chosen to match ROCm/RocmCIForSPIRV spirv_external_llvm.sh:
        # --offload-new-driver routes through the HIP offload codepath that
        # produces a fatbin HIP runtime can JIT for amdgcnspirv. Without it,
        # the runtime fails with "Failed to compile spirv to reloc" because
        # the bundle isn't in the format it expects.
        # --rocm-device-lib-path explicit because --rocm-path's auto-detect
        # doesn't always pick up the staged amdgcn/bitcode/ dir.
        # --unresolved-symbols=ignore-in-shared-libs because libamd_comgr.so
        # embeds its own LLVM symbols.
        # continue-on-error: true
        run: |
          STAGING=$PWD/staging
          LIBRARY_PATH=$STAGING/lib
          $PWD/build/bin/clang++ -std=c++17 \
            -x hip --offload-arch=amdgcnspirv --offload-new-driver \
            -D__HIP_PLATFORM_AMD__ \
            --rocm-path=$STAGING \
            --rocm-device-lib-path=$STAGING/amdgcn/bitcode \
            -I rocm-examples/Common \
            -L $STAGING/lib -Wl,-rpath,$STAGING/lib \
            -Wl,--unresolved-symbols=ignore-in-shared-libs \
            -lamdhip64 -lhsa-runtime64 \
            -o hello_world \
            rocm-examples/HIP-Basic/hello_world/main.hip

      - name: Run hello-world
        # continue-on-error: true
        # Diagnostic mode while we stabilize the SPIR-V JIT path:
        # - AMD_LOG_LEVEL=3, HIP_LAUNCH_BLOCKING=1: HIP runtime trace.
        # - AMD_COMGR_REDIRECT_LOGS=stderr + AMD_COMGR_SAVE_TEMPS=/tmp/comgr:
        #   surface Comgr error detail + dump intermediate files.
        # - ROCM_PATH=$STAGING: hint Comgr to find device-libs in staging
        #   instead of falling back to /opt/rocm.
        run: |
          STAGING=$PWD/staging
          LD_LIBRARY_PATH=$STAGING/lib ./hello_world | tee run.log


################################################################################
# Applications
################################################################################

      - name: ROCm Examples build Applications
        # continue-on-error: true
        # Scope: HIP-Basic only. Applications/ and Libraries/ pull in
        # hipcub/rocrand/rocfft/... which aren't part of the staging build.
        # HIP_PLATFORM=amd bypasses hip-config.cmake's hipconfig probe
        # (hipconfig isn't installed under staging/).
        # HIPFLAGS injects --rocm-path plus the linker path/rpath that
        # libamdhip64.so's DT_NEEDED on libhsa-runtime64.so requires.
        # CMAKE_HIP_COMPILER_ROCM_ROOT tells CMake where ROCm is without
        # needing hipconfig or clang's "Found HIP installation" output.
        run: |
          STAGING=$PWD/staging
          LLVM_PATH=$PWD/build
          cmake -S rocm-examples/Applications -B examples-build-Applications   \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING \
            -DCMAKE_PREFIX_PATH=$STAGING \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DHIP_PLATFORM=amd \
            -DROCM_PATH=$STAGING \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE \
            -DCMAKE_HIP_FLAGS="-DROCPRIM_DISABLE_DPP=1 --offload-new-driver --rocm-path=$STAGING -use-spirv-backend --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_HIP_LINK_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_CXX_FLAGS="--rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_EXE_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_SHARED_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc"
          cmake --build examples-build-Applications -j


################################################################################
# HIP-Basic
################################################################################

      - name: ROCm Examples build HIP-Basic
        # continue-on-error: true
        run: |
          STAGING=$PWD/staging
          LLVM_PATH=$PWD/build
          cmake -S rocm-examples/HIP-Basic -B examples-build-hip-basic    \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DHIP_PLATFORM=amd \
            -DROCM_PATH=$STAGING \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE \
            -DCMAKE_HIP_FLAGS="-DROCPRIM_DISABLE_DPP=1 --offload-new-driver --rocm-path=$STAGING -use-spirv-backend --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_HIP_LINK_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_CXX_FLAGS="--rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_EXE_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_SHARED_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc"
          cmake --build examples-build-hip-basic -j


################################################################################
# Libraries
################################################################################

      - name: ROCm Examples build Libraries
        continue-on-error: true
        run: |
          STAGING=$PWD/staging
          LLVM_PATH=$PWD/build
          cmake -S rocm-examples/Libraries -B examples-build-Libraries    \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING \
            -DCMAKE_PREFIX_PATH=$STAGING \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DHIP_PLATFORM=amd \
            -DROCM_PATH=$STAGING \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE \
            -DCMAKE_HIP_FLAGS="-DROCPRIM_DISABLE_DPP=1 --offload-new-driver --rocm-path=$STAGING -use-spirv-backend --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_HIP_LINK_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_CXX_FLAGS="--rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_EXE_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs" \
            -DCMAKE_SHARED_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc"
          cmake --build examples-build-Libraries -j


################################################################################
# Tutorials (requires C++20)
################################################################################

      - name: ROCm Examples build Tutorials
        continue-on-error: true
        run: |
          STAGING=$PWD/staging
          LLVM_PATH=$PWD/build
          cmake -S rocm-examples/Tutorials -B examples-build-Tutorials    \
            -DCMAKE_CXX_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER=$LLVM_PATH/bin/clang++ \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=$STAGING \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DHIP_PLATFORM=amd \
            -DROCM_PATH=$STAGING \
            -DCMAKE_HIP_ARCHITECTURES=amdgcnspirv \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_Perl=TRUE \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_HIP_FLAGS="-std=c++20 -DROCPRIM_DISABLE_DPP=1 --offload-new-driver --rocm-path=$STAGING -use-spirv-backend --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_HIP_LINK_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs -lpthread" \
            -DCMAKE_CXX_FLAGS="-std=c++20 -Wno-c2y-extensions --rtlib=libgcc -unwindlib=libgcc" \
            -DCMAKE_EXE_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc -L$STAGING/lib -Wl,-rpath,$STAGING/lib -Wl,--unresolved-symbols=ignore-in-shared-libs -lpthread" \
            -DCMAKE_SHARED_LINKER_FLAGS="--rtlib=libgcc -unwindlib=libgcc"
          cmake --build examples-build-Tutorials -j


################################################################################
# TESTS
################################################################################

      - name: ROCm Examples run Applications
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/staging/lib
        run: |
          ctest --test-dir examples-build-Applications --output-on-failure --no-tests=ignore -E '^applications_monte_carlo_pi$'

      - name: ROCm Examples run HIP-Basic
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/staging/lib
        run: |
          ctest --test-dir examples-build-hip-basic --output-on-failure --no-tests=ignore -E '^hip_cooperative_groups$'

      - name: ROCm Examples run Libraries
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/staging/lib
        run: |
          ctest --test-dir examples-build-Libraries --output-on-failure --no-tests=ignore -E '^(hiprand_simple_distributions_cpp|rocrand_simple_distributions_cpp)$'

      - name: ROCm Examples run Tutorials
        continue-on-error: true
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/staging/lib
        run: |
          ctest --test-dir examples-build-Tutorials --output-on-failure --no-tests=ignore




      - name: Compile rocm-examples
        # Iterates the same example sets ROCm/RocmCIForSPIRV's
        # spirv_external_llvm.sh builds for SPIR-V mode:
        #   - SIMPLE_EXAMPLES:   HIP-Basic single-source examples (16)
        #   - EXTERNAL_EXAMPLES: HIP-Basic + External/ include (2)
        #   - runtime_compilation: HIP-Basic + -lhiprtc (1)
        #   - APPLICATIONS:      Applications/ + External/ include (6)
        #   - REDUCTION:         Tutorials/reduction v1..v9, c++20 (9)
        # Excluded: opengl/vulkan interop, hello_world_cuda, hipify,
        # assembly_to_executable, llvm_ir_to_executable, sobel_filter
        # (need libs we don't have or use native-AMDGPU codepaths
        # incompatible with SPIR-V). multi_gpu_data_transfer requires
        # >1 GPU; this runner is 1gpu-ossci-rocm. Library-conditional
        # examples (rocPRIM, hipCUB, monte_carlo_pi via hipRAND) need
        # rocm-libraries math-libs which we don't build here.
        # Flags match the working compile invocation from RocmCIForSPIRV.
        run: |
          set +e
          STAGING=$PWD/staging
          CLANG=$PWD/build/bin/clang++

          SIMPLE_EXAMPLES=(
            bit_extract cooperative_groups device_globals device_query
            dynamic_shared events gpu_arch hello_world
            inline_assembly moving_average occupancy saxpy
            shared_memory streams texture_management warp_shuffle
          )
          # HIP-Basic examples that need -I External
          EXTERNAL_EXAMPLES=(bandwidth matrix_multiplication)
          APPLICATIONS=(
            bitonic_sort convolution fdtd floyd_warshall histogram prefix_sum
          )
          REDUCTION_VERSIONS=(v1 v2 v3 v4 v5 v6 v7 v8 v9)

          BASE_FLAGS=(
            -x hip --offload-arch=amdgcnspirv --offload-new-driver
            -D__HIP_PLATFORM_AMD__
            --rocm-path=$STAGING
            --rocm-device-lib-path=$STAGING/amdgcn/bitcode
            -L $STAGING/lib -Wl,-rpath,$STAGING/lib
            -Wl,--unresolved-symbols=ignore-in-shared-libs
            -lamdhip64 -lhsa-runtime64
          )

          BUILD_FAILED=()
          BUILD_OK=()

          build_one() {
            local name="$1" src="$2" extra_inc="$3" cxxstd="${4:-c++17}"
            if [ ! -f "$src" ]; then
              echo "SKIP $name (no source at $src)"
              return 0
            fi
            if $CLANG -std=$cxxstd "${BASE_FLAGS[@]}" \
                  -I rocm-examples/Common $extra_inc \
                  -o "$name" "$src" 2>/tmp/build_err.txt; then
              BUILD_OK+=("$name")
              echo "BUILD OK:   $name"
            else
              BUILD_FAILED+=("$name")
              echo "BUILD FAIL: $name"
              head -8 /tmp/build_err.txt
            fi
          }

          for ex in "${SIMPLE_EXAMPLES[@]}"; do
            build_one "$ex" "rocm-examples/HIP-Basic/$ex/main.hip" ""
          done
          for ex in "${EXTERNAL_EXAMPLES[@]}"; do
            build_one "$ex" "rocm-examples/HIP-Basic/$ex/main.hip" "-I rocm-examples/External"
          done
          # runtime_compilation needs libhiprtc at link time.
          build_one "runtime_compilation" \
            "rocm-examples/HIP-Basic/runtime_compilation/main.hip" "-lhiprtc"
          for ex in "${APPLICATIONS[@]}"; do
            build_one "$ex" "rocm-examples/Applications/$ex/main.hip" "-I rocm-examples/External"
          done
          for v in "${REDUCTION_VERSIONS[@]}"; do
            build_one "reduction_$v" "rocm-examples/Tutorials/reduction/example/$v.hip" \
              "-I rocm-examples/Tutorials/reduction/include" "c++20"
          done

          echo ""
          echo "=== Compile summary ==="
          echo "Built:  ${#BUILD_OK[@]}"
          echo "Failed: ${#BUILD_FAILED[@]}"
          for f in "${BUILD_FAILED[@]}"; do echo "  - $f"; done

          # Persist the built list for the Run step.
          printf '%s\n' "${BUILD_OK[@]}" > built_examples.txt

          [ ${#BUILD_FAILED[@]} -eq 0 ]

      - name: Dump fatbin contents
        # Diagnostic: list what targets are bundled in the binary's .hip_fatbin
        # section. Helps verify SPIR-V actually got embedded with the right
        # target string vs LLVM IR or some other format.
        run: |
          echo "=== .hip_fatbin section ==="
          $PWD/build/bin/llvm-objdump -h hello_world | grep -E "fatbin|hip_" || true
          echo "=== Extract and list bundle ==="
          $PWD/build/bin/llvm-objcopy --dump-section=.hip_fatbin=hello_world.fatbin hello_world || true
          $PWD/build/bin/clang-offload-bundler --type=o --input=hello_world.fatbin --list 2>&1 | head -20 || true
          echo "=== strings(hello_world) | grep amdgcn ==="
          strings hello_world | grep -iE "amdgcn|spirv" | head -10 || true

      - name: Probe runner state + clean caches
        # Confirm what HIP/Comgr libs are actually getting loaded — there's
        # a /opt/rocm-6.4.1 on the runner that could be overriding our
        # staged tree via libamdhip64's rpath/runpath.
        run: |
          STAGING=$PWD/staging
          echo "=== /opt/rocm ==="
          ls -d /opt/rocm* 2>&1 || true
          echo "=== ldd ./hello_world (with our LD_LIBRARY_PATH) ==="
          LD_LIBRARY_PATH=$STAGING/lib ldd ./hello_world 2>&1 | grep -iE "amdhip|amd_comgr|hsa-runtime|hsakmt" || true
          echo "=== rpath/runpath of staged libamdhip64.so ==="
          readelf -d $STAGING/lib/libamdhip64.so | grep -iE "runpath|rpath|needed" | head -10 || true
          echo "=== rpath/runpath of staged libamd_comgr.so ==="
          readelf -d $STAGING/lib/libamd_comgr.so | grep -iE "runpath|rpath" | head -5 || true
          echo "=== Comgr cache ==="
          ls -la ~/.cache/comgr 2>&1 | head -3 || echo "no ~/.cache/comgr"
          ls -la ~/.amd/comgr 2>&1 | head -3 || echo "no ~/.amd/comgr"
          rm -rf ~/.cache/comgr ~/.amd/comgr || true

      - name: Run rocm-examples
        # Runs each example that built. Gates on exit code 0 (any non-zero
        # = crash / hipError / assert). 60s timeout per example.
        run: |
          set +e
          STAGING=$PWD/staging
          export LD_LIBRARY_PATH=$STAGING/lib

          RUN_OK=()
          RUN_FAILED=()

          while IFS= read -r exe; do
            [ -z "$exe" ] && continue
            [ -x "./$exe" ] || continue
            if timeout 60 "./$exe" > "/tmp/${exe}.out" 2>&1; then
              RUN_OK+=("$exe")
              echo "RUN OK:   $exe"
            else
              RUN_FAILED+=("$exe")
              echo "RUN FAIL: $exe (exit $?)"
              head -10 "/tmp/${exe}.out"
            fi
          done < built_examples.txt

          echo ""
          echo "=== Run summary ==="
          echo "Passed: ${#RUN_OK[@]}"
          echo "Failed: ${#RUN_FAILED[@]}"
          for f in "${RUN_FAILED[@]}"; do echo "  - $f"; done

          [ ${#RUN_FAILED[@]} -eq 0 ]


