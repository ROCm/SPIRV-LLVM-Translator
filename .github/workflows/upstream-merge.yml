name: Merge Upstream

on:
  schedule:
    # Weekdays at 08:07 UTC — ~9am CET / 10am CEST, start-of-day for
    # Central Europe reviewers. Overnight in the US so PRs are ready to
    # land first thing. Off-the-hour to avoid cron-fleet pile-ups.
    - cron: '7 8 * * 1-5'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-upstream:
    if: ${{ github.repository == 'ROCm/SPIRV-LLVM-Translator' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # Upstream merges can change workflow files.

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: amd-staging
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          git fetch upstream main

      - name: Get timestamp
        id: timestamp
        run: |
          echo "datetime=$(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_OUTPUT

      - name: Check for new commits
        id: check-commits
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor $UPSTREAM_SHA HEAD; then
            echo "No new upstream commits"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream commits found"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create merge branch
        id: merge
        if: steps.check-commits.outputs.has_changes == 'true'
        env:
          MERGE_DATETIME: ${{ steps.timestamp.outputs.datetime }}
        run: |
          BRANCH_NAME="upstream-merge-$(date +%Y%m%d%H%M%S)"
          PR_TITLE="Upstream merge $MERGE_DATETIME"
          git checkout -b $BRANCH_NAME
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT

          if git merge upstream/main --no-edit; then
            echo "Merge successful"
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            echo "Merge has conflicts"
            # Capture conflicting files before aborting
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -10)
            CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
          fi

          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Push branch
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.merge.outputs.branch }}
        run: |
          git -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push origin "$BRANCH_NAME"

      - name: Create Pull Request
        id: create-pr
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.merge.outputs.branch }}
          PR_TITLE: ${{ steps.merge.outputs.pr_title }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base amd-staging \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --reviewer maarquitos14,AlexVlx,lamb-j,idubinov \
            --body "$(cat <<'EOF'
          Automated merge of upstream KhronosGroup/SPIRV-LLVM-Translator main branch.

          This PR was created automatically by the upstream-merge workflow.

          > [!IMPORTANT]
          > Merge with **"Create a merge commit"**, not squash — squashing destroys the upstream ancestry link and causes conflicts on every future merge.
          EOF
          )")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Enable auto-merge (merge commit)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
        run: |
          # Lock merge method to "Create a merge commit" to preserve upstream ancestry.
          gh pr merge "$PR_URL" --auto --merge \
            || echo "::warning::Could not enable auto-merge; reviewers must pick 'Create a merge commit' manually."

      - name: Notify Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          MERGE_DATETIME: ${{ steps.timestamp.outputs.datetime }}
          HAS_CHANGES: ${{ steps.check-commits.outputs.has_changes }}
          MERGE_CONFLICT: ${{ steps.merge.outputs.conflict }}
          BRANCH_NAME: ${{ steps.merge.outputs.branch }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          CONFLICT_COUNT: ${{ steps.merge.outputs.conflict_count }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request

          env = os.environ
          facts = [{"title": "Time", "value": env["MERGE_DATETIME"]}]
          details = []
          if env["HAS_CHANGES"] == "false":
              title = "ℹ️ No New Upstream Commits"
              details.append("amd-staging is already up to date with upstream main.")
          elif env["MERGE_CONFLICT"] == "true":
              title = "⚠️ Merge Conflicts Detected"
              facts.append({"title": "Conflicting Files",
                            "value": f"{env['CONFLICT_COUNT']} file(s)"})
              details.append(f"Conflicting files:\n{env['CONFLICT_FILES']}")
              run_url = (f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}"
                         f"/actions/runs/{env['GITHUB_RUN_ID']}")
              details.append(f"[View workflow run]({run_url})")
          elif env["MERGE_CONFLICT"] == "false":
              title = "✅ Upstream Merge PR Created"
              facts.extend([{"title": "Branch", "value": env["BRANCH_NAME"]},
                            {"title": "PR", "value": env["PR_URL"]}])
          else:
              raise ValueError("Unexpected merge outcome")

          payload = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {"type": "TextBlock", "text": title, "weight": "Bolder",
                   "size": "Large", "wrap": True},
                  {"type": "FactSet", "facts": facts},
                  *({"type": "TextBlock", "text": text, "wrap": True}
                    for text in details),
              ],
          }
          request = urllib.request.Request(
              env["TEAMS_WEBHOOK_URL"], json.dumps(payload).encode(),
              {"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Teams HTTP {response.status}")
          PYTHON
