name: Merge Upstream

on:
  schedule:
    # Weekdays at 08:07 UTC — ~9am CET / 10am CEST, start-of-day for
    # Central Europe reviewers. Overnight in the US so PRs are ready to
    # land first thing. Off-the-hour to avoid cron-fleet pile-ups.
    - cron: '7 8 * * 1-5'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # Push branches
  pull-requests: write  # Create PRs

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: amd-staging
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          git fetch upstream main

      - name: Get timestamp
        id: timestamp
        run: |
          echo "datetime=$(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_OUTPUT

      - name: Check for new commits
        id: check-commits
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor $UPSTREAM_SHA HEAD; then
            echo "No new upstream commits"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream commits found"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create merge branch
        id: merge
        if: steps.check-commits.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="upstream-merge-$(date +%Y%m%d%H%M%S)"
          PR_TITLE="Upstream merge ${{ steps.timestamp.outputs.datetime }}"
          git checkout -b $BRANCH_NAME
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT

          if git merge upstream/main --no-edit; then
            echo "Merge successful"
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            echo "Merge has conflicts"
            # Capture conflicting files before aborting
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -10)
            CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
          fi

          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Push branch
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin ${{ steps.merge.outputs.branch }}

      - name: Create Pull Request
        id: create-pr
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr create \
            --repo ${{ github.repository }} \
            --base amd-staging \
            --head ${{ steps.merge.outputs.branch }} \
            --title "${{ steps.merge.outputs.pr_title }}" \
            --reviewer maarquitos14,MrSidims,AlexVlx,lamb-j,steffenlarsen,mgcarrasco \
            --body "$(cat <<'EOF'
          Automated merge of upstream KhronosGroup/SPIRV-LLVM-Translator main branch.

          **Merge this PR using "Create a merge commit" — do NOT squash.**
          Squash-merging destroys upstream ancestry tracking and will cause
          conflicts on every future merge.

          This PR was created automatically by the upstream-merge workflow.
          EOF
          )")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Enable auto-merge (merge commit)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Lock merge method to "Create a merge commit" to preserve upstream ancestry.
          gh pr merge "${{ steps.create-pr.outputs.pr_url }}" --auto --merge \
            || echo "::warning::Could not enable auto-merge; reviewers must pick 'Create a merge commit' manually."

      - name: Notify Teams - PR Created
        if: steps.merge.outputs.conflict == 'false'
        run: |
          curl -sf -o /dev/null -H "Content-Type: application/json" -d '{
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "type": "AdaptiveCard",
            "version": "1.4",
            "body": [{
              "type": "TextBlock",
              "text": "✅ Upstream Merge PR Created",
              "weight": "Bolder",
              "size": "Large",
              "wrap": true
            }, {
              "type": "FactSet",
              "facts": [{
                "title": "Time",
                "value": "${{ steps.timestamp.outputs.datetime }}"
              }, {
                "title": "Branch",
                "value": "${{ steps.merge.outputs.branch }}"
              }, {
                "title": "PR",
                "value": "${{ steps.create-pr.outputs.pr_url }}"
              }]
            }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams - No Changes
        if: steps.check-commits.outputs.has_changes == 'false'
        run: |
          curl -sf -o /dev/null -H "Content-Type: application/json" -d '{
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "type": "AdaptiveCard",
            "version": "1.4",
            "body": [{
              "type": "TextBlock",
              "text": "ℹ️ No New Upstream Commits",
              "weight": "Bolder",
              "size": "Large",
              "wrap": true
            }, {
              "type": "FactSet",
              "facts": [{
                "title": "Time",
                "value": "${{ steps.timestamp.outputs.datetime }}"
              }]
            }, {
              "type": "TextBlock",
              "text": "amd-staging is already up to date with upstream main.",
              "wrap": true
            }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Teams - Merge Conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          CONFLICT_COUNT: ${{ steps.merge.outputs.conflict_count }}
        run: |
          python3 -c "
import json, sys, urllib.request
dt, files, count, run_url, url = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
payload = {'\$schema': 'http://adaptivecards.io/schemas/adaptive-card.json', 'type': 'AdaptiveCard', 'version': '1.4', 'body': [{'type': 'TextBlock', 'text': '⚠️ Merge Conflicts Detected', 'weight': 'Bolder', 'size': 'Large', 'wrap': True}, {'type': 'FactSet', 'facts': [{'title': 'Time', 'value': dt}, {'title': 'Conflicting Files', 'value': f'{count} file(s)'}]}, {'type': 'TextBlock', 'text': f'Conflicting files:\n{files}', 'wrap': True}, {'type': 'TextBlock', 'text': f'[View workflow run]({run_url})', 'wrap': True}]}
req = urllib.request.Request(url, json.dumps(payload).encode(), {'Content-Type': 'application/json'}, method='POST')
with urllib.request.urlopen(req, timeout=30) as r: print(f'Teams HTTP {r.status}')
" \
            "${{ steps.timestamp.outputs.datetime }}" \
            "$CONFLICT_FILES" \
            "${{ steps.merge.outputs.conflict_count }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
