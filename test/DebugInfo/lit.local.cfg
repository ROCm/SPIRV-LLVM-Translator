config.substitutions.append(('%triple', config.target_triple))

# Debug info tests need llc and DWARF tools, so allow skipping them in builds
# without these.
if config.spirv_skip_debug_info_tests:
    config.unsupported = True

diops_path = os.path.join(config.llvm_src_root, "include/llvm/IR/DIExprOps.def")
if os.path.exists(diops_path):
    config.available_features.add('diop-diexpressions')
